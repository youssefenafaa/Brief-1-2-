            <section class="secCards2">

                <h4><strong>In Progress</strong></h4>




            </section>
            <section class="seccards3">
                <h4><strong>Done</strong></h4>

        <section class="sectionErreur hiden">

            <button class="buterreur btn btn-outline-danger">ressayer</button>

        </section>

                <div>
                    <h4><strong>Nouvelle Carte </strong> </h1>
                </div>
                <div>
                    <label for="">Title
                        <input type="text" name="title" class="inputTitle">
                    </label>
                    <p class="TitleChamp"></p>

                </div>
                <div>
                    <label for="">description
                        <input type="text" name="description" class="inputDescription">
                    </label>
                </div>
                <div>
                    <label for="select-status">Status *</label>
                    <select name="status" class="custom-select" id="select-status">
                        <option value="todo">TO do</option>
                        <option value="in-progress">In Progress</option>
                        <option value="done">Done</option>
                    </select>
                </div>
                <div>
                    <label for="select-priority">priority *</label>
                    <select name="priority" class="custom-select" id="select-priority">
                        <option value="low">low</option>
                        <option value="medium">medium</option>
                        <option value="high">high</option>
                    </select>

                      <div class="section-members">
            <select name="assignee" id="input-assignne" class="custom-select">
                <option value="Amina Haddad">Amina Haddad</option>

                <option value="Inès Moreau">Inès Moreau</option>
            </select>
                   
                    <!-- <p class="assigneeChamp"></p> -->

                </div>
                <div>

                </div>
                <div class="butAjouer">
                    <button type="button" class="btn btn-outline-primary" id="butAjo">Ajouter la Carte</button>
                </div>
                <div class="zoneModifier">
                    <button type="submit" class="btn btn-outline-primary" id="butModifer">Modifier la Carte</button>
                </div>
